<title>Ante</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-sized column. Big mono clock numerals are the focal point; everything else stays quiet.
   Radius rule: outer containers 24, inner elements 16. Spacing on a 4px scale. */
:root{
  --stage:#E3E6EC;
  --bg:#EEF0F4;
  --surface:#FFFFFF;
  --surface-2:#F3F4F7;
  --ink:#15171C;
  --ink-2:#5E6471;
  --line:#DDE1E8;
  --accent:#2D47F0;
  --accent-ink:#FFFFFF;
  --accent-soft:#E3E7FE;
  --win:#13784A;
  --loss:#C2352B;
  --zero:#13784A;
  --card:#FFFFFF;
  --card-red:#C2352B;
  --scrim:rgba(21,23,28,.36);

  --f-ui:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-num:"Spline Sans Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r-out:24px;--r-in:16px;
  --t-xs:12px;--t-sm:14px;--t-md:16px;--t-lg:20px;--t-xl:28px;--t-hero:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#08090B;--bg:#101115;--surface:#181A20;--surface-2:#20232A;--ink:#ECEEF3;--ink-2:#8E94A1;--line:#2A2E37;
    --accent:#7286FF;--accent-ink:#0B0D14;--accent-soft:#232A4D;--win:#42C987;--loss:#FF6E61;--zero:#42C987;
    --card:#F4F5F8;--card-red:#C2352B;--scrim:rgba(0,0,0,.55);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --stage:#08090B;--bg:#101115;--surface:#181A20;--surface-2:#20232A;--ink:#ECEEF3;--ink-2:#8E94A1;--line:#2A2E37;
  --accent:#7286FF;--accent-ink:#0B0D14;--accent-soft:#232A4D;--win:#42C987;--loss:#FF6E61;--zero:#42C987;
  --card:#F4F5F8;--card-red:#C2352B;--scrim:rgba(0,0,0,.55);color-scheme:dark;
}

html,body{height:100%}
body{
  margin:0;background:var(--stage);color:var(--ink);
  font-family:var(--f-ui);font-size:var(--t-md);line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- stage + device ---------- */
.stage{height:100%;display:flex;flex-direction:column;align-items:center;gap:var(--s3);padding-block:var(--s4)}
.protobar{width:100%;max-width:390px;display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.seg{display:flex;padding:var(--s1);gap:var(--s1);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-out)}
.seg button{height:36px;padding-inline:var(--s4);border-radius:var(--r-in);font-size:var(--t-sm);font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.textbtn{font-size:var(--t-sm);font-weight:600;color:var(--ink-2);height:36px;padding-inline:var(--s2)}
.textbtn:hover{color:var(--ink)}

.device{
  flex:1 1 auto;min-height:600px;max-height:844px;width:100%;max-width:390px;
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-out);
}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow-y:auto;padding:var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s5)}
.screen > *,.block > *{flex-shrink:0}

/* ---------- type ---------- */
.eyebrow{font-size:var(--t-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.h1{font-size:var(--t-xl);font-weight:700;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.h2{font-size:var(--t-lg);font-weight:600;letter-spacing:-.01em;line-height:1.25}
.muted{color:var(--ink-2);font-size:var(--t-sm)}
.timer{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:var(--t-hero);font-weight:500;letter-spacing:-.04em;line-height:1}
.win{color:var(--win)}.loss{color:var(--loss)}

/* ---------- building blocks ---------- */
.panel{background:var(--surface);border-radius:var(--r-out);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4)}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.link{font-size:var(--t-sm);font-weight:600;color:var(--accent)}
.tile{
  --h:#888;flex:none;width:40px;height:40px;border-radius:var(--r-in);
  display:grid;place-items:center;font-weight:700;font-size:var(--t-sm);letter-spacing:-.01em;
  background:color-mix(in oklab,var(--h) 16%,var(--surface));
  color:color-mix(in oklab,var(--h) 78%,var(--ink));
}
.tile.lg{width:64px;height:64px;font-size:var(--t-lg)}
.btn{height:52px;border-radius:var(--r-in);font-weight:600;display:flex;align-items:center;justify-content:center;gap:var(--s2);padding-inline:var(--s4);width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--surface-2);color:var(--loss)}
.btn-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:var(--s2)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.chip{height:40px;border-radius:var(--r-in);background:var(--surface-2);font-size:var(--t-sm);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.bar{height:6px;border-radius:var(--r-in);background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--ink)}
.bar.out i{background:var(--loss)}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:var(--s2)}
.stepper button{height:52px;border-radius:var(--r-in);background:var(--surface-2);font-size:var(--t-lg);font-weight:500}
.stepper .num{text-align:center;font-size:var(--t-xl);font-weight:500}

/* ---------- today ---------- */
.hero{display:flex;flex-direction:column;gap:var(--s2);padding-inline:var(--s1)}
.list{gap:0;padding-block:var(--s2)}
.list .panel-head{padding-block:var(--s2) var(--s3)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:var(--s3);padding-block:var(--s3);text-align:left;width:100%;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .meta{display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.row .name{font-weight:600;display:flex;justify-content:space-between;gap:var(--s2)}
.row .left{font-size:var(--t-lg);font-weight:500;text-align:right}
.row .sub{font-size:var(--t-xs);color:var(--ink-2)}
.ledger-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:baseline;padding-block:var(--s3);border-top:1px dashed var(--line)}
.ledger-row:first-of-type{border-top:0}
.ledger-row .what{font-size:var(--t-sm);font-weight:600}
.ledger-row .when{font-size:var(--t-xs);color:var(--ink-2)}
.ledger-row .delta{font-weight:500}
.empty{display:flex;flex-direction:column;gap:var(--s3);align-items:flex-start;padding-block:var(--s2)}

/* ---------- tab bar ---------- */
.tabbar{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--surface);padding-bottom:var(--s1)}
.tabbar button{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);font-size:var(--t-xs);font-weight:600;color:var(--ink-2)}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar svg{width:22px;height:22px}

/* ---------- play ---------- */
.applist{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--s4) * -1);padding-inline:var(--s4)}
.appchip{flex:none;display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s3) var(--s1) var(--s1);border-radius:var(--r-in);background:var(--surface-2);font-size:var(--t-sm);font-weight:600}
.appchip .tile{width:32px;height:32px;font-size:var(--t-xs);border-radius:12px}
.appchip .num{font-weight:500;color:var(--ink-2)}
.appchip[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft)}
.game-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding-block:var(--s3);border-top:1px solid var(--line);text-align:left;width:100%}
.game-row:first-of-type{border-top:0}
.glyph{width:44px;height:44px;border-radius:var(--r-in);background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-num);font-weight:600}
.game-row .rtp{font-size:var(--t-xs);color:var(--ink-2);text-align:right}
.game-row .rtp b{display:block;font-family:var(--f-num);font-size:var(--t-md);font-weight:500;color:var(--ink)}
.fine{font-size:var(--t-xs);color:var(--ink-2);padding-inline:var(--s1);max-width:60ch}
.return{display:flex;align-items:center;gap:var(--s2);height:44px;padding-inline:var(--s3);border-radius:var(--r-in);background:var(--accent-soft);color:var(--accent);font-size:var(--t-sm);font-weight:600;align-self:flex-start}

/* ---------- game ---------- */
.gtop{display:flex;align-items:center;gap:var(--s3)}
.iconbtn{width:44px;height:44px;border-radius:var(--r-in);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.table{min-height:248px;align-items:center;justify-content:center;text-align:center}
.result{min-height:24px;font-weight:600;text-align:center}
.stakebox{display:flex;flex-direction:column;gap:var(--s3)}
.stakebox .top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}

/* coin */
.coin{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);box-shadow:inset 0 0 0 6px var(--line);font-family:var(--f-num);font-size:var(--t-xl);font-weight:600}
.coin.spin{animation:flip .9s cubic-bezier(.3,.7,.3,1)}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(1800deg)}}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);width:100%}

/* roulette */
.pocket{width:112px;height:112px;border-radius:var(--r-in);display:grid;place-items:center;font-family:var(--f-num);font-size:44px;font-weight:600;color:#fff;background:var(--ink-2)}
.pocket.red{background:var(--card-red)}.pocket.black{background:#15171C}.pocket.green{background:var(--zero)}
.history{display:flex;gap:var(--s1);justify-content:center;min-height:24px}
.history span{min-width:28px;height:24px;padding-inline:var(--s1);border-radius:8px;font-family:var(--f-num);font-size:var(--t-xs);display:grid;place-items:center;color:#fff}
.history .red{background:var(--card-red)}.history .black{background:#15171C}.history .green{background:var(--zero)}
.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);width:100%}
.bets .chip{height:44px}
.straight{display:grid;grid-template-columns:44px 1fr 44px;gap:var(--s2);width:100%;align-items:center}
.straight button.step{height:44px;border-radius:var(--r-in);background:var(--surface-2);font-size:var(--t-lg)}

/* slots */
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);width:100%}
.reel{aspect-ratio:3/4;max-width:100%;border-radius:var(--r-in);background:var(--surface-2);display:grid;place-items:center}
.reel svg{width:56%;height:auto}
.reel.hit{box-shadow:inset 0 0 0 2px var(--win)}
.paytable{display:grid;grid-template-columns:1fr auto;gap:var(--s1) var(--s4);width:100%;font-size:var(--t-xs);color:var(--ink-2);text-align:left}
.paytable .num{color:var(--ink);text-align:right}
.paytable .on{color:var(--win);font-weight:600}

/* cards */
.hand{display:flex;flex-direction:column;gap:var(--s2);width:100%;align-items:flex-start}
.hand .lbl{display:flex;gap:var(--s2);align-items:baseline;font-size:var(--t-xs);color:var(--ink-2);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hand .lbl .num{color:var(--ink);font-size:var(--t-sm);letter-spacing:0}
.cards{display:flex;gap:var(--s2);flex-wrap:wrap;min-height:84px}
.pcard{width:56px;height:84px;border-radius:var(--r-in);background:var(--card);border:1px solid var(--line);color:#15171C;display:flex;flex-direction:column;justify-content:space-between;padding:var(--s2);font-family:var(--f-num);font-weight:600;line-height:1;text-align:left;position:relative}
.pcard .r{font-size:var(--t-lg)}
.pcard .s{font-size:var(--t-lg);align-self:flex-end;font-family:var(--f-ui)}
.pcard.red{color:var(--card-red)}
.pcard.back{background:var(--accent);border-color:var(--accent);background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.18) 6px 7px)}
.pcard.held{transform:translateY(-6px);box-shadow:0 0 0 2px var(--accent)}
.pcard .held-tag{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font-family:var(--f-ui);font-size:10px;letter-spacing:.08em;color:var(--accent)}
.poker .cards{flex-wrap:nowrap;gap:6px;justify-content:center;width:100%;padding-bottom:var(--s5)}
.poker .pcard{width:calc((100% - 24px) / 5);max-width:56px}

/* ---------- phone simulator ---------- */
.home{flex:1;display:flex;flex-direction:column;gap:var(--s6);padding:var(--s6) var(--s5);background:var(--surface-2)}
.home .clock{font-family:var(--f-num);font-size:var(--t-hero);font-weight:500;letter-spacing:-.04em;text-align:center;line-height:1}
.home .date{text-align:center;color:var(--ink-2);font-size:var(--t-sm);margin-top:var(--s2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s5) var(--s3)}
.launch{display:flex;flex-direction:column;align-items:center;gap:var(--s2);font-size:var(--t-xs);font-weight:500;position:relative}
.launch .tile{width:60px;height:60px;font-size:var(--t-lg)}
.launch .badge{position:absolute;top:-6px;right:2px;height:20px;padding-inline:6px;border-radius:10px;background:var(--ink);color:var(--bg);font-family:var(--f-num);font-size:10px;display:grid;place-items:center}
.launch .badge.out{background:var(--loss);color:#fff}
.hint{margin-top:auto;text-align:center;font-size:var(--t-xs);color:var(--ink-2)}

.block{flex:1;display:flex;flex-direction:column;gap:var(--s5);padding:var(--s6) var(--s4) var(--s5);overflow-y:auto}
.block .who{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s3)}
.block .left{display:flex;flex-direction:column;gap:var(--s2)}
.block .note{font-size:var(--t-sm);font-weight:600}
.block .spacer{flex:1}

.session{flex:1;display:flex;flex-direction:column;background:var(--surface)}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s4);border-bottom:1px solid var(--line)}
.sbar .pill{height:32px;padding-inline:var(--s3);border-radius:var(--r-in);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600}
.feed{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:var(--s4);padding:var(--s4)}
.post{display:flex;flex-direction:column;gap:var(--s2)}
.post .who{display:flex;gap:var(--s2);align-items:center}
.post .av{width:28px;height:28px;border-radius:50%;background:var(--surface-2)}
.post .ln{height:10px;border-radius:var(--r-in);background:var(--surface-2)}
.post .img{aspect-ratio:1/1;border-radius:var(--r-in);background:var(--surface-2)}
.sfoot{padding:var(--s4);border-top:1px solid var(--line)}

/* ---------- sheet + toast ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;background:var(--surface);border-radius:var(--r-out) var(--r-out) 0 0;padding:var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s5);max-height:85%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:var(--s3)}
.sheet-head .grow{flex:1;min-width:0}
.toast{position:absolute;left:var(--s4);right:var(--s4);bottom:76px;z-index:6;background:var(--ink);color:var(--bg);border-radius:var(--r-in);padding:var(--s3) var(--s4);font-size:var(--t-sm);font-weight:500;pointer-events:none;animation:up .2s ease-out}

@media (max-width:480px){
  .stage{padding-block:var(--s2)}
  .device{min-height:0;max-height:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition:none!important}
}
</style>

<div class="stage">
  <div class="protobar">
    <div class="seg" role="group" aria-label="Prototype view">
      <button id="m-app" data-p="app" aria-pressed="true">Ante</button>
      <button id="m-phone" data-p="phone" aria-pressed="false">Home screen</button>
    </div>
    <button class="textbtn" id="reset" data-p="reset">Reset demo</button>
  </div>
  <div class="device" id="device">
    <div id="app"></div>
    <div id="overlay"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- data ---------- */
const APPS = {
  instagram:{name:"Instagram",mono:"Ig",hue:"#C13584"},
  tiktok:{name:"TikTok",mono:"Tk",hue:"#0E9F99"},
  youtube:{name:"YouTube",mono:"Yt",hue:"#D93636"},
  x:{name:"X",mono:"X",hue:"#5B6472"},
  reddit:{name:"Reddit",mono:"Rd",hue:"#F0601F"},
  snapchat:{name:"Snapchat",mono:"Sc",hue:"#C9A400"}
};
const OTHER = [
  {id:"messages",name:"Messages",mono:"Ms",hue:"#2E9E5B"},
  {id:"camera",name:"Camera",mono:"Ca",hue:"#6B7280"},
  {id:"maps",name:"Maps",mono:"Mp",hue:"#2F7FD8"},
  {id:"ante",name:"Ante",mono:"A",hue:"#2D47F0"}
];
const GAMES = [
  {id:"coin",name:"Coin flip",rule:"Call it. Pays 1.9×",rtp:"95%",glyph:"H/T"},
  {id:"blackjack",name:"Blackjack",rule:"Beat the dealer to 21",rtp:"≈99%",glyph:"21"},
  {id:"roulette",name:"Roulette",rule:"Single zero, 37 pockets",rtp:"97.3%",glyph:"0"},
  {id:"poker",name:"Poker",rule:"Five-card draw, jacks or better",rtp:"≈96%",glyph:"JJ"},
  {id:"slots",name:"Slots",rule:"Three reels, 7s pay 100×",rtp:"93%",glyph:"777"}
];
const KEY = "ante-proto-v1";

function defaults(){
  return {
    limits:[
      {id:"instagram",limit:1200,left:840},
      {id:"tiktok",limit:1800,left:1800},
      {id:"youtube",limit:2700,left:1520}
    ],
    ledger:[
      {game:"Coin flip",app:"instagram",delta:270,at:"10:42"},
      {game:"Roulette",app:"youtube",delta:-300,at:"08:15"}
    ]
  };
}
let S = load();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const v = JSON.parse(raw); if(v && Array.isArray(v.limits)) return v; } }catch(e){}
  return defaults();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const ui = {
  mode:"app", tab:"today", game:null, sheet:null,
  stakeApp:"instagram", stake:300, returnApp:null,
  phone:"home", block:null, session:null, toast:null, g:{}
};

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const $overlay = document.getElementById("overlay");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const pad = n => String(n).padStart(2,"0");
function fmt(s){
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
}
const signed = d => (d >= 0 ? "+" : "−") + fmt(Math.abs(d));
const lim = id => S.limits.find(l => l.id === id);
const app = id => APPS[id] || OTHER.find(o => o.id === id);

function toast(msg){
  ui.toast = msg; paintOverlay();
  clearTimeout(toast.t); toast.t = setTimeout(()=>{ ui.toast = null; paintOverlay(); }, 2200);
}

/* ---------- staking ---------- */
function stakeLimit(){ return lim(ui.stakeApp); }
function clampStake(){
  const l = stakeLimit(); if(!l) return;
  const max = Math.floor(l.left/60)*60;
  ui.stake = Math.max(60, Math.min(ui.stake, Math.max(60, max)));
}
function canStake(extra){ const l = stakeLimit(); return !!l && l.left >= (extra ?? ui.stake) && ui.stake >= 60; }
function take(sec){ const l = stakeLimit(); l.left = Math.max(0, l.left - sec); save(); }
function pay(sec){ const l = stakeLimit(); l.left += Math.round(sec); save(); }
function log(game, delta){
  S.ledger.unshift({game, app:ui.stakeApp, delta:Math.round(delta), at:clock()});
  S.ledger = S.ledger.slice(0, 40); save();
}
function settle(game, stake, ret){
  pay(ret); log(game, ret - stake);
  const net = Math.round(ret - stake);
  if(net > 0) return {tone:"win", text:`You win ${fmt(net)} of ${app(ui.stakeApp).name}.`};
  if(net === 0) return {tone:"", text:"Push. Your stake comes back."};
  if(ret > 0) return {tone:"loss", text:`You get ${fmt(ret)} back. Net ${signed(net)}.`};
  return {tone:"loss", text:`You lose ${fmt(stake)}.`};
}

/* roulette */
const REDS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const color = n => n === 0 ? "green" : REDS.has(n) ? "red" : "black";
const RBETS = [["red","Red",2],["black","Black",2],["even","Even",2],["odd","Odd",2],["low","1–18",2],["high","19–36",2],["d1","1st 12",3],["d2","2nd 12",3],["d3","3rd 12",3]];
function rWins(bet, n, num){
  if(bet === "num") return n === num;
  if(n === 0) return false;
  return {red:REDS.has(n),black:!REDS.has(n),even:n%2===0,odd:n%2===1,low:n<=18,high:n>=19,d1:n<=12,d2:n>12&&n<=24,d3:n>24}[bet];
}
function vRoulette(g){
  const G = ui.g, spinning = G.phase === "spin";
  const n = G.shown;
  const table = `<div class="pocket ${n==null?"":color(n)}">${n==null?"–":n}</div>
    <div class="history" aria-label="Last spins">${G.hist.map(h=>`<span class="${color(h)}">${h}</span>`).join("")}</div>`;
  const mult = G.bet === "num" ? 36 : RBETS.find(b=>b[0]===G.bet)[2];
  const actions = `<div class="bets">${RBETS.map(([id,t])=>`<button class="chip" data-a="rBet" data-v="${id}" aria-pressed="${G.bet===id}" ${spinning?"disabled":""}>${t}</button>`).join("")}</div>
    <div class="straight">
      <button class="step" data-a="rNum" data-d="-1" aria-label="Lower number" ${spinning?"disabled":""}>−</button>
      <button class="chip" data-a="rBet" data-v="num" aria-pressed="${G.bet==="num"}" ${spinning?"disabled":""}>Number <span class="num">${G.num}</span></button>
      <button class="step" data-a="rNum" data-d="1" aria-label="Higher number" ${spinning?"disabled":""}>+</button>
    </div>
    ${canStake()||spinning ? `<button class="btn primary" data-a="rSpin" ${spinning?"disabled":""}>Spin for ${fmt(ui.stake)} · pays ${mult}×</button>` : noStake()}`;
  return gameFrame(g, table, actions, spinning);
}
function rSpin(){
  const G = ui.g; if(!canStake()) return;
  const stake = ui.stake; take(stake); G.phase = "spin"; G.res = null;
  const n = rnd(37);
  const tick = setInterval(()=>{ G.shown = rnd(37); render(); }, 70);
  setTimeout(()=>{
    clearInterval(tick);
    G.shown = n; G.hist = [n, ...G.hist].slice(0,8);
    const mult = G.bet === "num" ? 36 : RBETS.find(b=>b[0]===G.bet)[2];
    G.res = settle("Roulette", stake, rWins(G.bet, n, G.num) ? stake*mult : 0);
    G.res.text = `${n} ${color(n)}. ` + G.res.text;
    G.phase = "idle"; render();
  }, reduced ? 250 : 1400);
  render();
}

/* slots */
const SYM = ["7","star","tri","dot","sq"], WEIGHT = [1,2,3,4,5];
const PAY3 = {"7":100,star:40,tri:20,dot:10,sq:5};
function symSvg(s){
  const c = "currentColor";
  switch(s){
    case "7": return `<svg viewBox="0 0 40 40" aria-label="seven"><text x="20" y="31" text-anchor="middle" font-family="Spline Sans Mono, monospace" font-weight="600" font-size="34" fill="var(--accent)">7</text></svg>`;
    case "star": return `<svg viewBox="0 0 40 40" aria-label="star"><path d="M20 4l4.7 10.3 11.3 1.2-8.4 7.6 2.4 11.1L20 28.5l-10 5.7 2.4-11.1L4 15.5l11.3-1.2z" fill="${c}"/></svg>`;
    case "tri": return `<svg viewBox="0 0 40 40" aria-label="triangle"><path d="M20 6l16 28H4z" fill="${c}"/></svg>`;
    case "dot": return `<svg viewBox="0 0 40 40" aria-label="circle"><circle cx="20" cy="20" r="14" fill="${c}"/></svg>`;
    default: return `<svg viewBox="0 0 40 40" aria-label="square"><rect x="7" y="7" width="26" height="26" rx="4" fill="${c}"/></svg>`;
  }
}
function pickSym(){ let r = Math.random()*15; for(let i=0;i<5;i++){ r -= WEIGHT[i]; if(r < 0) return SYM[i]; } return "sq"; }
function slotPay(r){
  if(r[0]===r[1] && r[1]===r[2]) return {m:PAY3[r[0]], k:"3"+r[0]};
  if(r.filter(s=>s==="7").length===2) return {m:5, k:"77"};
  if(new Set(r).size===2) return {m:.4, k:"pair"};
  return {m:0, k:""};
}
function vSlots(g){
  const G = ui.g, spinning = G.phase === "spin";
  const hit = !spinning && G.last && G.last.m > 0;
  const rows = [["3 7","7 7 7","100×","37"],["3star","Three stars","40×","3star"],["3tri","Three triangles","20×","3tri"],["3dot","Three circles","10×","3dot"],["3sq","Three squares","5×","3sq"],["77","Any two 7s","5×","77"],["pair","Any other pair","0.4×","pair"]];
  const key = G.last && !spinning ? G.last.k : "";
  const table = `<div class="reels">${G.reels.map(s=>`<div class="reel ${hit?"hit":""}">${symSvg(s)}</div>`).join("")}</div>
    <div class="paytable">${rows.map(r=>`<span class="${key===r[3]?"on":""}">${r[1]}</span><span class="num ${key===r[3]?"on":""}">${r[2]}</span>`).join("")}</div>`;
  const actions = canStake()||spinning ? `<button class="btn primary" data-a="sSpin" ${spinning?"disabled":""}>Spin for ${fmt(ui.stake)}</button>` : noStake();
  return gameFrame(g, table, actions, spinning);
}
function sSpin(){
  const G = ui.g; if(!canStake()) return;
  const stake = ui.stake; take(stake); G.phase = "spin"; G.res = null; G.last = null;
  const final = [pickSym(), pickSym(), pickSym()];
  let stopped = 0;
  const tick = setInterval(()=>{ for(let i=stopped;i<3;i++) G.reels[i] = SYM[rnd(5)]; render(); }, 80);
  const stops = reduced ? [80,160,240] : [700,1000,1300];
  stops.forEach((t,i)=>setTimeout(()=>{
    G.reels[i] = final[i]; stopped = i+1;
    if(i === 2){
      clearInterval(tick);
      G.last = slotPay(final);
      G.res = settle("Slots", stake, stake*G.last.m);
      G.phase = "idle";
    }
    render();
  }, t));
  render();
}

/* cards */
const RANK = r => ({1:"A",11:"J",12:"Q",13:"K"})[r] || String(r);
const SUIT = ["♠","♥","♦","♣"];
const cardHtml = (c, extra="") => c.hidden
  ? `<span class="pcard back" aria-label="Face-down card"></span>`
  : `<span class="pcard ${c.s===1||c.s===2?"red":""} ${extra}" aria-label="${RANK(c.r)} of ${["spades","hearts","diamonds","clubs"][c.s]}"><span class="r">${RANK(c.r)}</span><span class="s">${SUIT[c.s]}</span></span>`;
const draw1 = () => ({r:1+rnd(13), s:rnd(4)});
function bjVal(h){
  let t = 0, a = 0;
  for(const c of h){ if(c.r===1){a++; t+=11;} else t += Math.min(10,c.r); }
  while(t > 21 && a){ t -= 10; a--; }
  return t;
}

/* blackjack */
function vBlackjack(g){
  const G = ui.g, playing = G.phase === "play";
  const dealer = G.d.map((c,i)=> (playing && i===1) ? {hidden:true} : c);
  const dv = G.d.length ? (playing ? bjVal([G.d[0]]) : bjVal(G.d)) : null;
  const pv = G.p.length ? bjVal(G.p) : null;
  const table = `<div class="hand"><span class="lbl">Dealer <span class="num">${dv??""}</span></span><div class="cards">${dealer.map(c=>cardHtml(c)).join("")}</div></div>
    <div class="hand"><span class="lbl">You <span class="num">${pv??""}</span></span><div class="cards">${G.p.map(c=>cardHtml(c)).join("")}</div></div>`;
  let actions;
  if(playing){
    const canDouble = G.p.length===2 && stakeLimit().left >= G.stake;
    actions = `<div class="btn-row">
      <button class="btn quiet" data-a="bjHit">Hit</button>
      <button class="btn primary" data-a="bjStand">Stand</button>
      <button class="btn quiet" data-a="bjDouble" ${canDouble?"":"disabled"}>Double</button></div>`;
  } else {
    actions = canStake() ? `<button class="btn primary" data-a="bjDeal">Deal for ${fmt(ui.stake)}</button>` : noStake();
  }
  return gameFrame(g, table, actions, playing);
}
function bjDeal(){
  const G = ui.g; if(!canStake()) return;
  G.stake = ui.stake; take(G.stake); G.res = null;
  G.p = [draw1(), draw1()]; G.d = [draw1(), draw1()]; G.phase = "play";
  const pbj = bjVal(G.p)===21, dbj = bjVal(G.d)===21;
  if(pbj || dbj) return bjEnd(pbj && dbj ? G.stake : pbj ? G.stake*2.5 : 0, pbj&&!dbj ? "Blackjack. " : dbj&&!pbj ? "Dealer has blackjack. " : "");
  render();
}
function bjHit(){
  const G = ui.g; G.p.push(draw1());
  const v = bjVal(G.p);
  if(v > 21) return bjEnd(0, `Bust at ${v}. `);
  if(v === 21) return bjStand();
  render();
}
function bjDouble(){
  const G = ui.g; take(G.stake); G.stake *= 2; G.p.push(draw1());
  const v = bjVal(G.p);
  if(v > 21) return bjEnd(0, `Bust at ${v}. `);
  bjStand();
}
function bjStand(){
  const G = ui.g;
  while(bjVal(G.d) < 17) G.d.push(draw1());
  const pv = bjVal(G.p), dv = bjVal(G.d);
  if(dv > 21) return bjEnd(G.stake*2, `Dealer busts at ${dv}. `);
  if(pv > dv) return bjEnd(G.stake*2, `${pv} beats ${dv}. `);
  if(pv === dv) return bjEnd(G.stake, `${pv} each. `);
  bjEnd(0, `Dealer's ${dv} beats ${pv}. `);
}
function bjEnd(ret, prefix){
  const G = ui.g; G.phase = "idle";
  G.res = settle("Blackjack", G.stake, ret); G.res.text = prefix + G.res.text;
  render();
}

/* poker */
const PPAY = [["Royal flush",250],["Straight flush",50],["Four of a kind",25],["Full house",8],["Flush",5],["Straight",4],["Three of a kind",3],["Two pair",2],["Jacks or better",1]];
function deck(){
  const d = []; for(let s=0;s<4;s++) for(let r=1;r<=13;r++) d.push({r,s});
  for(let i=d.length-1;i>0;i--){ const j = rnd(i+1); [d[i],d[j]] = [d[j],d[i]]; }
  return d;
}
function pokerRank(h){
  const rs = h.map(c=>c.r===1?14:c.r).sort((a,b)=>a-b);
  const cnt = {}; rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const cv = Object.values(cnt).sort((a,b)=>b-a);
  const flush = h.every(c=>c.s===h[0].s);
  const uniq = new Set(rs).size === 5;
  const straight = uniq && (rs[4]-rs[0]===4 || rs.join()==="2,3,4,5,14");
  if(straight && flush && rs[0]===10) return "Royal flush";
  if(straight && flush) return "Straight flush";
  if(cv[0]===4) return "Four of a kind";
  if(cv[0]===3 && cv[1]===2) return "Full house";
  if(flush) return "Flush";
  if(straight) return "Straight";
  if(cv[0]===3) return "Three of a kind";
  if(cv[0]===2 && cv[1]===2) return "Two pair";
  if(cv[0]===2){ const pr = +Object.keys(cnt).find(k=>cnt[k]===2); if(pr >= 11) return "Jacks or better"; }
  return null;
}
function vPoker(g){
  const G = ui.g, dealt = G.phase === "dealt";
  const now = G.hand.length ? pokerRank(G.hand) : null;
  const cards = G.hand.length
    ? G.hand.map((c,i)=> dealt
        ? `<button class="pcard ${c.s===1||c.s===2?"red":""} ${G.held[i]?"held":""}" data-a="pHold" data-i="${i}" aria-pressed="${G.held[i]}" aria-label="${RANK(c.r)} of ${["spades","hearts","diamonds","clubs"][c.s]}${G.held[i]?", held":""}"><span class="r">${RANK(c.r)}</span><span class="s">${SUIT[c.s]}</span>${G.held[i]?'<span class="held-tag">HELD</span>':""}</button>`
        : cardHtml(c)).join("")
    : Array.from({length:5},()=>cardHtml({hidden:true})).join("");
  const table = `<div class="poker" style="width:100%"><div class="cards">${cards}</div></div>
    <div class="paytable">${PPAY.map(([n,m])=>`<span class="${now===n?"on":""}">${n}</span><span class="num ${now===n?"on":""}">${m}×</span>`).join("")}</div>`;
  const actions = dealt
    ? `<p class="muted" style="text-align:center">Tap the cards you want to keep, then draw.</p><button class="btn primary" data-a="pDraw">Draw</button>`
    : canStake() ? `<button class="btn primary" data-a="pDeal">Deal for ${fmt(ui.stake)}</button>` : noStake();
  return gameFrame(g, table, actions, dealt);
}
function pDeal(){
  const G = ui.g; if(!canStake()) return;
  G.stake = ui.stake; take(G.stake); G.res = null;
  G.deck = deck(); G.hand = G.deck.splice(0,5); G.held = [false,false,false,false,false]; G.phase = "dealt";
  render();
}
function pDraw(){
  const G = ui.g;
  G.hand = G.hand.map((c,i)=> G.held[i] ? c : G.deck.shift());
  const rank = pokerRank(G.hand), m = rank ? PPAY.find(p=>p[0]===rank)[1] : 0;
  G.phase = "idle";
  G.res = settle("Poker", G.stake, G.stake*m);
  G.res.text = (rank ? rank + ". " : "No pair of jacks or better. ") + G.res.text;
  render();
}

function newGame(id){
  const base = {phase:"idle", res:null};
  ui.g = Object.assign(base, {
    coin:{pick:"H", result:null},
    roulette:{bet:"red", num:17, shown:null, hist:[]},
    slots:{reels:["7","star","tri"], last:null},
    blackjack:{p:[], d:[], stake:0},
    poker:{hand:[], held:[], deck:[], stake:0}
  }[id]);
  ui.game = id;
}

/* ---------- views: phone simulator ---------- */
function vHome(){
  const d = new Date();
  const ids = [...Object.keys(APPS), ...OTHER.map(o=>o.id)];
  const tiles = ids.map(id => {
    const l = lim(id);
    const badge = l ? `<span class="badge num ${l.left<=0?"out":""}">${l.left<=0?"0m":Math.ceil(l.left/60)+"m"}</span>` : "";
    return `<button class="launch" data-a="open" data-id="${id}">${tile(id)}${badge}<span>${app(id).name}</span></button>`;
  }).join("");
  return `<div class="home">
    <div><p class="clock">${pad(d.getHours())}:${pad(d.getMinutes())}</p>
    <p class="date">${d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</p></div>
    <div class="grid">${tiles}</div>
    <p class="hint">Simulated Android home screen. Open a limited app to see Ante step in.</p>
  </div>`;
}
function vBlock(){
  const B = ui.block, l = lim(B.app), a = app(B.app);
  if(!l){ ui.phone = "home"; return vHome(); }
  if(l.left <= 0){
    return `<div class="block">
      <div class="who">${tile(B.app,"lg")}<p class="eyebrow">Ante</p><h1 class="h1">${a.name} is done for today</h1></div>
      <div class="left"><p class="timer loss">0:00</p><p class="muted">Your limit resets at midnight.</p></div>
      ${B.note?`<p class="note">${B.note}</p>`:""}
      <div class="spacer"></div>
      <button class="btn quiet" data-a="closeBlock">Back to home screen</button>
    </div>`;
  }
  const opts = [[300,"5:00"],[600,"10:00"],[900,"15:00"],[l.left,"All"]];
  if(B.pick > l.left) B.pick = l.left;
  return `<div class="block">
    <div class="who">${tile(B.app,"lg")}<p class="eyebrow">Ante</p><h1 class="h1">${a.name} has a daily limit</h1></div>
    <div class="left"><p class="timer num">${fmt(l.left)}</p><p class="muted">left today</p></div>
    ${B.note?`<p class="note">${B.note}</p>`:""}
    <div class="spacer"></div>
    <section class="panel">
      <span class="eyebrow">Open for</span>
      <div class="chips">${opts.map(([v,t])=>`<button class="chip" data-a="pickUse" data-v="${v}" aria-pressed="${B.pick===v}" ${v>l.left?"disabled":""}>${t}</button>`).join("")}</div>
      <button class="btn primary" data-a="startSession">Open ${a.name} for ${fmt(B.pick)}</button>
      <button class="btn quiet" data-a="playFrom">Play for more time</button>
    </section>
    <button class="btn" data-a="closeBlock" style="height:44px;color:var(--ink-2)">Not now</button>
  </div>`;
}
function vSession(){
  const Z = ui.session, a = app(Z.app);
  const posts = Array.from({length:3},()=>`<div class="post"><div class="who"><span class="av"></span><span class="ln" style="width:40%"></span></div><div class="img"></div><span class="ln" style="width:80%"></span></div>`).join("");
  return `<div class="session">
    <div class="sbar"><div style="display:flex;gap:var(--s3);align-items:center">${tile(Z.app)}<strong>${a.name}</strong></div>
      <span class="pill num" aria-live="off">${fmt(Z.remaining)}</span></div>
    <div class="feed" aria-hidden="true">${posts}</div>
    <div class="sfoot"><button class="btn quiet" data-a="endSession">Close ${a.name}</button></div>
  </div>`;
}

/* ---------- overlay: sheets + toast ---------- */
function vSheet(){
  const sh = ui.sheet; if(!sh) return "";
  if(sh.type === "add"){
    const rows = unlimited().map(id => `<button class="row" data-a="addApp" data-id="${id}">${tile(id)}<span class="meta"><span class="name">${app(id).name}</span></span><span class="muted">30:00 a day</span></button>`).join("");
    return `<div class="scrim" data-a="closeSheet"><div class="sheet" role="dialog" aria-label="Add an app" data-stop>
      <div class="sheet-head"><h2 class="h2 grow">Add an app</h2><button class="iconbtn" style="background:var(--surface-2)" data-a="closeSheet" aria-label="Close">${ICON.close}</button></div>
      <div>${rows || `<p class="muted">Every app already has a limit.</p>`}</div></div></div>`;
  }
  const l = lim(sh.id), a = app(sh.id);
  return `<div class="scrim" data-a="closeSheet"><div class="sheet" role="dialog" aria-label="${a.name} limit" data-stop>
    <div class="sheet-head">${tile(sh.id)}<div class="grow"><h2 class="h2">${a.name}</h2><p class="muted"><span class="num">${fmt(l.left)}</span> left today</p></div>
      <button class="iconbtn" style="background:var(--surface-2)" data-a="closeSheet" aria-label="Close">${ICON.close}</button></div>
    <div class="stakebox"><span class="eyebrow">Daily limit</span>
      <div class="stepper"><button data-a="limStep" data-d="-300" aria-label="Five minutes less" ${sh.limit<=300?"disabled":""}>−</button>
        <span class="num">${fmt(sh.limit)}</span>
        <button data-a="limStep" data-d="300" aria-label="Five minutes more" ${sh.limit>=14400?"disabled":""}>+</button></div>
      <div class="chips">${[[900,"15:00"],[1200,"20:00"],[1800,"30:00"],[3600,"1:00:00"]].map(([v,t])=>`<button class="chip" data-a="limSet" data-v="${v}" aria-pressed="${sh.limit===v}">${t}</button>`).join("")}</div>
    </div>
    <div class="btn-row"><button class="btn danger" data-a="removeApp">Remove limit</button><button class="btn primary" data-a="saveLimit">Save</button></div>
  </div></div>`;
}
function paintOverlay(){
  $overlay.innerHTML = vSheet() + (ui.toast ? `<div class="toast" role="status">${ui.toast}</div>` : "");
}

/* ---------- render ---------- */
function render(){
  document.getElementById("m-app").setAttribute("aria-pressed", ui.mode==="app");
  document.getElementById("m-phone").setAttribute("aria-pressed", ui.mode==="phone");
  let html;
  if(ui.mode === "phone"){
    html = ui.phone === "session" && ui.session ? vSession() : ui.phone === "block" && ui.block ? vBlock() : vHome();
  } else {
    let body;
    if(ui.tab === "play" && ui.game){
      const g = GAMES.find(x=>x.id===ui.game);
      body = {coin:vCoin,roulette:vRoulette,slots:vSlots,blackjack:vBlackjack,poker:vPoker}[ui.game](g);
    } else body = ui.tab === "play" ? vPlay() : vToday();
    const busy = ui.g && (ui.g.phase === "spin" || ui.g.phase === "play" || ui.g.phase === "dealt") && ui.tab === "play" && ui.game;
    html = body + `<nav class="tabbar" aria-label="Sections">
      <button data-a="tab" data-t="today" aria-current="${ui.tab==="today"?"page":"false"}" ${busy?"disabled":""}>${ICON.today}Today</button>
      <button data-a="tab" data-t="play" aria-current="${ui.tab==="play"?"page":"false"}">${ICON.play}Play</button></nav>`;
  }
  const scroller = $app.querySelector(".screen");
  const top = scroller ? scroller.scrollTop : 0;
  const sameView = render.key === viewKey();
  $app.innerHTML = html;
  if(sameView){ const s = $app.querySelector(".screen"); if(s) s.scrollTop = top; }
  render.key = viewKey();
  paintOverlay();
}
const viewKey = () => [ui.mode, ui.phone, ui.tab, ui.game].join("|");

/* ---------- session clock ---------- */
setInterval(()=>{
  const Z = ui.session; if(!Z) return;
  const l = lim(Z.app);
  if(!l){ ui.session = null; return; }
  l.left = Math.max(0, l.left - 1); Z.remaining -= 1; save();
  if(Z.remaining <= 0 || l.left <= 0){
    ui.session = null; ui.phone = "block";
    ui.block = {app:Z.app, pick:Math.min(300,l.left), note:"Session over."};
  }
  if(ui.mode === "phone") render();
}, 1000);

/* ---------- actions ---------- */
const A = {
  tab(d){ ui.tab = d.t; if(d.t === "today") ui.game = null; render(); },
  edit(d){ ui.sheet = {type:"edit", id:d.id, limit:lim(d.id).limit}; paintOverlay(); },
  add(){ ui.sheet = {type:"add"}; paintOverlay(); },
  addApp(d){ S.limits.push({id:d.id, limit:1800, left:1800}); save(); ui.sheet = null; render(); toast(`${app(d.id).name} added with 30:00 a day.`); },
  closeSheet(){ ui.sheet = null; paintOverlay(); },
  limStep(d){ ui.sheet.limit = Math.max(300, Math.min(14400, ui.sheet.limit + +d.d)); paintOverlay(); },
  limSet(d){ ui.sheet.limit = +d.v; paintOverlay(); },
  saveLimit(){
    const l = lim(ui.sheet.id), diff = ui.sheet.limit - l.limit;
    l.limit = ui.sheet.limit; l.left = Math.max(0, l.left + diff); save();
    ui.sheet = null; render(); toast(`${app(l.id).name} limit set to ${fmt(l.limit)}.`);
  },
  removeApp(){ const id = ui.sheet.id; S.limits = S.limits.filter(l=>l.id!==id); save(); ui.sheet = null; render(); toast(`${app(id).name} no longer has a limit.`); },
  stakeApp(d){ ui.stakeApp = d.id; clampStake(); render(); },
  stake(d){ ui.stake += +d.d; clampStake(); render(); },
  stakeSet(d){ ui.stake = +d.v; clampStake(); render(); },
  game(d){ newGame(d.id); render(); },
  leave(){ ui.game = null; render(); },
  coinPick(d){ ui.g.pick = d.v; ui.g.result = null; render(); },
  coinFlip, rSpin, sSpin, bjDeal, bjHit, bjStand, bjDouble, pDeal, pDraw,
  rBet(d){ ui.g.bet = d.v; render(); },
  rNum(d){ ui.g.num = (ui.g.num + +d.d + 37) % 37; ui.g.bet = "num"; render(); },
  pHold(d){ ui.g.held[+d.i] = !ui.g.held[+d.i]; render(); },
  open(d){
    if(d.id === "ante"){ ui.mode = "app"; render(); return; }
    const l = lim(d.id);
    if(!l){ toast(`${app(d.id).name} has no limit, so it opens normally.`); return; }
    ui.block = {app:d.id, pick:Math.min(300, l.left), note:""}; ui.phone = "block"; render();
  },
  pickUse(d){ ui.block.pick = +d.v; render(); },
  startSession(){
    const B = ui.block; ui.session = {app:B.app, remaining:B.pick}; ui.phone = "session"; render();
  },
  endSession(){
    const Z = ui.session; ui.session = null; ui.phone = "home"; render();
    toast(`${app(Z.app).name} closed. ${fmt(lim(Z.app).left)} left today.`);
  },
  closeBlock(){ ui.block = null; ui.phone = "home"; render(); },
  playFrom(){
    const id = ui.block.app; ui.returnApp = id; ui.stakeApp = id; clampStake();
    ui.mode = "app"; ui.tab = "play"; ui.game = null; render();
  },
  return(){
    const id = ui.returnApp; ui.returnApp = null; ui.game = null; ui.tab = "today";
    ui.mode = "phone"; ui.phone = "block"; ui.block = {app:id, pick:Math.min(300, lim(id).left), note:""}; render();
  }
};

function onClick(e){
  const el = e.target.closest("[data-a]");
  if(!el || el.disabled) return;
  if(el.classList.contains("scrim") && e.target.closest("[data-stop]")) return;
  const fn = A[el.dataset.a]; if(fn) fn(el.dataset, el);
}
$app.addEventListener("click", onClick);
$overlay.addEventListener("click", onClick);
document.querySelector(".protobar").addEventListener("click", e => {
  const b = e.target.closest("[data-p]"); if(!b) return;
  if(b.dataset.p === "reset"){
    S = defaults(); save();
    Object.assign(ui, {mode:"app",tab:"today",game:null,sheet:null,stakeApp:"instagram",stake:300,returnApp:null,phone:"home",block:null,session:null,g:{}});
    render(); toast("Demo reset."); return;
  }
  if(ui.g && (ui.g.phase === "spin")) return;
  ui.mode = b.dataset.p; render();
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && ui.sheet){ ui.sheet = null; paintOverlay(); } });

window.claude?.hot?.snapshot?.(() => ({S}));
const start = data => { if(data && data.S && Array.isArray(data.S.limits)) S = data.S; render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
