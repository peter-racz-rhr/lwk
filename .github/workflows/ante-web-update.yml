# Publishes Ante's UI as a signed over-the-air update whenever the web files change.
# Installed apps pick it up the next time they're opened (no rebuild needed).
name: Ante UI update

on:
  push:
    branches: [main, claude/ecc-skill-exploration-qsu5pb]
    paths:
      - "ante-android/app/src/main/assets/web/**"
      - "ante-android/app/src/main/java/com/ante/app/Ota.kt"
      - ".github/workflows/ante-web-update.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ante-web-update
  cancel-in-progress: false

jobs:
  publish:
    # Only these branches may use the signing key, even for a manual run.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/ecc-skill-exploration-qsu5pb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Game rule tests
        run: node --test ante-android/web-tests/games.test.js

      - name: Check every script parses
        run: for f in ante-android/app/src/main/assets/web/js/*.js; do node --check "$f"; done

      - name: Build and sign the bundle
        env:
          ANTE_OTA_KEY: ${{ secrets.ANTE_OTA_KEY }}
        run: ante-android/scripts/ota-publish.sh build/ota "$GITHUB_REPOSITORY"

      - name: Publish to the web-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW=$(sed -n 's/.*"version":\([0-9]*\).*/\1/p' build/ota/manifest.json)
          NOW=$(date +%s)
          # Phones never go back to an older version, so a wrong clock would freeze updates: refuse it.
          if [ "$NEW" -gt $((NOW + 3600)) ]; then echo "Version $NEW is in the future; check the commit clock." >&2; exit 1; fi
          CUR=0
          if gh release download web-latest -p manifest.json -O /tmp/current.json 2>/dev/null; then
            CUR=$(sed -n 's/.*"version":\([0-9]*\).*/\1/p' /tmp/current.json); CUR=${CUR:-0}
          fi
          if [ "$NEW" -le "$CUR" ]; then echo "Published version $CUR is already as new as $NEW; nothing to do."; exit 0; fi
          if ! gh release view web-latest >/dev/null 2>&1; then
            gh release create web-latest --prerelease --title "Ante UI update" \
              --notes "Signed over-the-air UI bundle for the Ante Android app. Updated automatically on every push."
          fi
          # The zip first, then the manifest that points at it, so a phone never sees a manifest without its file.
          gh release upload web-latest build/ota/web-*.zip --clobber
          gh release upload web-latest build/ota/manifest.json --clobber
          # Keep the three newest bundles.
          gh release view web-latest --json assets --jq '.assets[].name' | grep '^web-[0-9]*\.zip$' | sort -t- -k2 -n | head -n -3 | while read -r old; do
            gh release delete-asset web-latest "$old" --yes
          done
